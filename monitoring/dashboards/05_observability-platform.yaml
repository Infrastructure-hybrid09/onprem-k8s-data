apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-observability-platform
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
    app.kubernetes.io/part-of: infraready-observability
data:
  observability-platform.json: |-
    {
      "annotations": {"list": []}, "editable": false, "graphTooltip": 1, "id": null,
      "panels": [
        {
          "datasource": {"type": "prometheus", "uid": "${DS_PROMETHEUS}"},
          "fieldConfig": {"defaults": {"color": {"mode": "thresholds"}, "mappings": [{"options": {"0": {"color": "red", "text": "DOWN"}, "1": {"color": "green", "text": "UP"}}, "type": "value"}]}, "overrides": []},
          "gridPos": {"h": 5, "w": 4, "x": 0, "y": 0}, "id": 1,
          "options": {"colorMode": "background", "graphMode": "none", "reduceOptions": {"calcs": ["lastNotNull"], "values": false}},
          "targets": [{"editorMode": "code", "expr": "up{job=\"prometheus\"}", "instant": true, "refId": "A"}],
          "title": "Prometheus Ready (PC6)", "type": "stat"
        },
        {
          "datasource": {"type": "prometheus", "uid": "${DS_PROMETHEUS}"},
          "fieldConfig": {"defaults": {"color": {"mode": "thresholds"}, "mappings": [{"options": {"0": {"color": "red", "text": "DOWN"}, "1": {"color": "green", "text": "UP"}}, "type": "value"}]}, "overrides": []},
          "gridPos": {"h": 5, "w": 4, "x": 4, "y": 0}, "id": 2,
          "options": {"colorMode": "background", "graphMode": "none", "reduceOptions": {"calcs": ["lastNotNull"], "values": false}},
          "targets": [{"editorMode": "code", "expr": "up{job=\"grafana\"}", "instant": true, "refId": "A"}],
          "title": "Grafana Ready (PC6)", "type": "stat"
        },
        {
          "datasource": {"type": "prometheus", "uid": "${DS_PROMETHEUS}"},
          "fieldConfig": {"defaults": {"color": {"mode": "thresholds"}, "mappings": [{"options": {"0": {"color": "red", "text": "DOWN"}, "1": {"color": "green", "text": "UP"}}, "type": "value"}]}, "overrides": []},
          "gridPos": {"h": 5, "w": 4, "x": 8, "y": 0}, "id": 3,
          "options": {"colorMode": "background", "graphMode": "none", "reduceOptions": {"calcs": ["lastNotNull"], "values": false}},
          "targets": [{"editorMode": "code", "expr": "up{job=\"alertmanager\"}", "instant": true, "refId": "A"}],
          "title": "Alertmanager Ready (PC6)", "type": "stat"
        },
        {
          "datasource": {"type": "prometheus", "uid": "${DS_PROMETHEUS}"},
          "fieldConfig": {"defaults": {"color": {"mode": "thresholds"}, "mappings": [{"options": {"0": {"color": "red", "text": "DOWN"}, "1": {"color": "green", "text": "UP"}}, "type": "value"}]}, "overrides": []},
          "gridPos": {"h": 5, "w": 4, "x": 12, "y": 0}, "id": 4,
          "options": {"colorMode": "background", "graphMode": "none", "reduceOptions": {"calcs": ["lastNotNull"], "values": false}},
          "targets": [{"editorMode": "code", "expr": "max(kube_statefulset_status_replicas_ready{namespace=\"logging\",statefulset=\"loki\",job!=\"dr-kube-state-metrics\"}) >= bool 1", "instant": true, "refId": "A"}],
          "title": "Loki Ready", "type": "stat"
        },
        {
          "datasource": {"type": "prometheus", "uid": "${DS_PROMETHEUS}"},
          "fieldConfig": {"defaults": {"color": {"mode": "thresholds"}, "decimals": 0, "thresholds": {"mode": "absolute", "steps": [{"color": "red", "value": null}, {"color": "green", "value": 6}]}}, "overrides": []},
          "gridPos": {"h": 5, "w": 4, "x": 16, "y": 0}, "id": 5,
          "options": {"colorMode": "background", "graphMode": "none", "reduceOptions": {"calcs": ["lastNotNull"], "values": false}},
          "targets": [{"editorMode": "code", "expr": "sum(kube_pod_status_ready{namespace=\"logging\",pod=~\"alloy-.*\",condition=\"true\"})", "instant": true, "refId": "A"}],
          "title": "Alloy Ready (목표 6)", "type": "stat"
        },
        {
          "datasource": {"type": "prometheus", "uid": "${DS_PROMETHEUS}"},
          "fieldConfig": {"defaults": {"color": {"mode": "thresholds"}, "decimals": 0, "thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}, {"color": "red", "value": 1}]}}, "overrides": []},
          "gridPos": {"h": 5, "w": 4, "x": 20, "y": 0}, "id": 6,
          "options": {"colorMode": "background", "graphMode": "none", "reduceOptions": {"calcs": ["lastNotNull"], "values": false}},
          "targets": [{"editorMode": "code", "expr": "count(ALERTS{alertstate=\"firing\"}) or vector(0)", "instant": true, "refId": "A"}],
          "title": "현재 Firing 경보", "type": "stat"
        },
        {
          "datasource": {"type": "prometheus", "uid": "${DS_PROMETHEUS}"},
          "fieldConfig": {"defaults": {"decimals": 0, "unit": "short"}, "overrides": []},
          "gridPos": {"h": 9, "w": 8, "x": 0, "y": 5}, "id": 7,
          "options": {"legend": {"displayMode": "table", "placement": "bottom", "showLegend": true}},
          "targets": [{"editorMode": "code", "expr": "prometheus_tsdb_head_series", "legendFormat": "활성 시계열", "refId": "A"}],
          "title": "Prometheus 활성 시계열", "type": "timeseries"
        },
        {
          "datasource": {"type": "prometheus", "uid": "${DS_PROMETHEUS}"},
          "fieldConfig": {"defaults": {"decimals": 0, "unit": "ops"}, "overrides": []},
          "gridPos": {"h": 9, "w": 8, "x": 8, "y": 5}, "id": 8,
          "options": {"legend": {"displayMode": "table", "placement": "bottom", "showLegend": true}},
          "targets": [{"editorMode": "code", "expr": "rate(prometheus_tsdb_head_samples_appended_total[5m])", "legendFormat": "samples/s", "refId": "A"}],
          "title": "Prometheus 수집 Sample 속도", "type": "timeseries"
        },
        {
          "datasource": {"type": "prometheus", "uid": "${DS_PROMETHEUS}"},
          "fieldConfig": {"defaults": {"decimals": 1, "unit": "Bps"}, "overrides": []},
          "gridPos": {"h": 9, "w": 8, "x": 16, "y": 5}, "id": 9,
          "options": {"legend": {"displayMode": "table", "placement": "bottom", "showLegend": true}},
          "targets": [{"editorMode": "code", "expr": "sum(rate(loki_distributor_bytes_received_total[5m]))", "legendFormat": "수신 로그 bytes/s", "refId": "A"}],
          "title": "Loki 로그 수신량", "description": "로그 본문은 Grafana Explore의 Loki 데이터소스에서 조회합니다.", "type": "timeseries"
        },
        {
          "datasource": {"type": "prometheus", "uid": "${DS_PROMETHEUS}"},
          "fieldConfig": {"defaults": {}, "overrides": []},
          "gridPos": {"h": 9, "w": 24, "x": 0, "y": 23}, "id": 10,
          "options": {"cellHeight": "sm", "showHeader": true},
          "targets": [{"editorMode": "code", "expr": "ALERTS{alertstate=\"firing\"}", "format": "table", "instant": true, "refId": "A"}],
          "title": "Firing Alert 상세 (alertname / severity / namespace)", "type": "table"
        },
        {
          "datasource": {"type": "prometheus", "uid": "${DS_PROMETHEUS}"},
          "fieldConfig": {"defaults": {"decimals": 1, "max": 100, "min": 0, "unit": "percent"}, "overrides": []},
          "gridPos": {"h": 9, "w": 8, "x": 0, "y": 14}, "id": 11,
          "options": {"legend": {"displayMode": "table", "placement": "bottom", "showLegend": true}, "tooltip": {"mode": "multi"}},
          "targets": [{"editorMode": "code", "expr": "100 - (avg(rate(node_cpu_seconds_total{job=\"monitoring-node\",mode=\"idle\"}[5m])) * 100)", "legendFormat": "PC6 Monitoring CPU", "refId": "A"}],
          "title": "PC6 Monitoring VM CPU", "type": "timeseries"
        },
        {
          "datasource": {"type": "prometheus", "uid": "${DS_PROMETHEUS}"},
          "fieldConfig": {"defaults": {"decimals": 1, "max": 100, "min": 0, "unit": "percent"}, "overrides": []},
          "gridPos": {"h": 9, "w": 8, "x": 8, "y": 14}, "id": 12,
          "options": {"legend": {"displayMode": "table", "placement": "bottom", "showLegend": true}, "tooltip": {"mode": "multi"}},
          "targets": [{"editorMode": "code", "expr": "100 * (1 - node_memory_MemAvailable_bytes{job=\"monitoring-node\"} / node_memory_MemTotal_bytes{job=\"monitoring-node\"})", "legendFormat": "PC6 Monitoring RAM", "refId": "A"}],
          "title": "PC6 Monitoring VM RAM", "type": "timeseries"
        },
        {
          "datasource": {"type": "prometheus", "uid": "${DS_PROMETHEUS}"},
          "fieldConfig": {"defaults": {"decimals": 1, "max": 100, "min": 0, "unit": "percent"}, "overrides": []},
          "gridPos": {"h": 9, "w": 8, "x": 16, "y": 14}, "id": 13,
          "options": {"legend": {"displayMode": "table", "placement": "bottom", "showLegend": true}, "tooltip": {"mode": "multi"}},
          "targets": [{"editorMode": "code", "expr": "100 * (1 - node_filesystem_avail_bytes{job=\"monitoring-node\",mountpoint=\"/var/lib/prometheus\",fstype!~\"tmpfs|overlay\"} / node_filesystem_size_bytes{job=\"monitoring-node\",mountpoint=\"/var/lib/prometheus\",fstype!~\"tmpfs|overlay\"})", "legendFormat": "Prometheus 데이터 디스크", "refId": "A"}],
          "title": "PC6 Prometheus 데이터 디스크", "type": "timeseries"
        }
      ],
      "refresh": "30s", "schemaVersion": 39,
      "tags": ["InfraReady", "Infrastructure", "Observability", "Prometheus", "Loki"],
      "templating": {"list": [{"current": {"text": "Prometheus", "value": "prometheus"}, "name": "DS_PROMETHEUS", "query": "prometheus", "refresh": 1, "type": "datasource"}]},
      "time": {"from": "now-6h", "to": "now"}, "timezone": "browser",
      "title": "05 Infrastructure - Observability Platform", "uid": "infraready-observability", "version": 1
    }
