apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-neuroplan-service
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
    app.kubernetes.io/part-of: infraready-observability
data:
  neuroplan-service.json: |-
    {
      "annotations": {"list": []}, "editable": false, "graphTooltip": 1, "id": null,
      "panels": [
        {
          "datasource": {"type": "prometheus", "uid": "${DS_PROMETHEUS}"},
          "fieldConfig": {"defaults": {"color": {"mode": "thresholds"}, "decimals": 0, "thresholds": {"mode": "absolute", "steps": [{"color": "red", "value": null}, {"color": "green", "value": 1}]}}, "overrides": []},
          "gridPos": {"h": 5, "w": 4, "x": 0, "y": 0}, "id": 1,
          "options": {"colorMode": "background", "graphMode": "none", "reduceOptions": {"calcs": ["lastNotNull"], "values": false}},
          "targets": [{"editorMode": "code", "expr": "sum(kube_deployment_status_replicas_available{namespace=\"application\",deployment=\"neuroplan-frontend\",job!=\"dr-kube-state-metrics\"})", "instant": true, "refId": "A"}],
          "title": "Main Frontend 가용 Pod", "type": "stat"
        },
        {
          "datasource": {"type": "prometheus", "uid": "${DS_PROMETHEUS}"},
          "fieldConfig": {"defaults": {"color": {"mode": "thresholds"}, "decimals": 0, "thresholds": {"mode": "absolute", "steps": [{"color": "red", "value": null}, {"color": "green", "value": 1}]}}, "overrides": []},
          "gridPos": {"h": 5, "w": 4, "x": 4, "y": 0}, "id": 2,
          "options": {"colorMode": "background", "graphMode": "none", "reduceOptions": {"calcs": ["lastNotNull"], "values": false}},
          "targets": [{"editorMode": "code", "expr": "sum(kube_deployment_status_replicas_available{namespace=\"application\",deployment=\"neuroplan-backend\",job!=\"dr-kube-state-metrics\"})", "instant": true, "refId": "A"}],
          "title": "Main Backend 가용 Pod", "type": "stat"
        },
        {
          "datasource": {"type": "prometheus", "uid": "${DS_PROMETHEUS}"},
          "fieldConfig": {"defaults": {"color": {"mode": "thresholds"}, "mappings": [{"options": {"0": {"color": "red", "text": "DOWN"}, "1": {"color": "green", "text": "UP"}}, "type": "value"}]}, "overrides": []},
          "gridPos": {"h": 5, "w": 4, "x": 8, "y": 0}, "id": 3,
          "options": {"colorMode": "background", "graphMode": "none", "reduceOptions": {"calcs": ["lastNotNull"], "values": false}},
          "targets": [{"editorMode": "code", "expr": "max(up{job=~\".*backend.*\",job!=\"dr-backend\"})", "instant": true, "refId": "A"}],
          "title": "Main Backend Metrics", "description": "Main Backend ServiceMonitor 적용 후 값이 표시됩니다.", "type": "stat"
        },
        {
          "datasource": {"type": "prometheus", "uid": "${DS_PROMETHEUS}"},
          "fieldConfig": {"defaults": {"color": {"mode": "thresholds"}, "mappings": [{"options": {"0": {"color": "red", "text": "DOWN"}, "1": {"color": "green", "text": "UP"}}, "type": "value"}]}, "overrides": []},
          "gridPos": {"h": 5, "w": 4, "x": 12, "y": 0}, "id": 4,
          "options": {"colorMode": "background", "graphMode": "none", "reduceOptions": {"calcs": ["lastNotNull"], "values": false}},
          "targets": [{"editorMode": "code", "expr": "up{job=\"dr-backend\"}", "instant": true, "refId": "A"}],
          "title": "DR Backend Metrics", "type": "stat"
        },
        {
          "datasource": {"type": "prometheus", "uid": "${DS_PROMETHEUS}"},
          "fieldConfig": {"defaults": {"color": {"mode": "thresholds"}, "decimals": 0, "thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}, {"color": "yellow", "value": 1}, {"color": "red", "value": 5}]}}, "overrides": []},
          "gridPos": {"h": 5, "w": 4, "x": 16, "y": 0}, "id": 5,
          "options": {"colorMode": "background", "graphMode": "none", "reduceOptions": {"calcs": ["lastNotNull"], "values": false}},
          "targets": [{"editorMode": "code", "expr": "sum(increase(kube_pod_container_status_restarts_total{namespace=\"application\",job!=\"dr-kube-state-metrics\"}[1h]))", "instant": true, "refId": "A"}],
          "title": "Main App 최근 1시간 재시작", "type": "stat"
        },
        {
          "datasource": {"type": "prometheus", "uid": "${DS_PROMETHEUS}"},
          "fieldConfig": {"defaults": {"color": {"mode": "thresholds"}, "decimals": 0, "thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}, {"color": "red", "value": 1}]}}, "overrides": []},
          "gridPos": {"h": 5, "w": 4, "x": 20, "y": 0}, "id": 6,
          "options": {"colorMode": "background", "graphMode": "none", "reduceOptions": {"calcs": ["lastNotNull"], "values": false}},
          "targets": [{"editorMode": "code", "expr": "sum(kube_deployment_status_replicas_unavailable{namespace=\"application\"})", "instant": true, "refId": "A"}],
          "title": "App 미가용 Replica", "type": "stat"
        },
        {
          "datasource": {"type": "prometheus", "uid": "${DS_PROMETHEUS}"},
          "fieldConfig": {"defaults": {"decimals": 2, "unit": "reqps"}, "overrides": []},
          "gridPos": {"h": 9, "w": 8, "x": 0, "y": 5}, "id": 7,
          "options": {"legend": {"displayMode": "table", "placement": "bottom", "showLegend": true}},
          "targets": [{"editorMode": "code", "expr": "sum by(job) (rate(http_server_requests_seconds_count{job=~\".*backend.*\"}[5m]))", "legendFormat": "{{job}}", "refId": "A"}],
          "title": "Backend 요청률", "type": "timeseries"
        },
        {
          "datasource": {"type": "prometheus", "uid": "${DS_PROMETHEUS}"},
          "fieldConfig": {"defaults": {"decimals": 2, "unit": "reqps"}, "overrides": []},
          "gridPos": {"h": 9, "w": 8, "x": 8, "y": 5}, "id": 8,
          "options": {"legend": {"displayMode": "table", "placement": "bottom", "showLegend": true}},
          "targets": [{"editorMode": "code", "expr": "sum by(job,status) (rate(http_server_requests_seconds_count{job=~\".*backend.*\",status=~\"5..\"}[5m])) or vector(0)", "legendFormat": "{{job}} {{status}}", "refId": "A"}],
          "title": "Backend 5xx 응답률", "type": "timeseries"
        },
        {
          "datasource": {"type": "prometheus", "uid": "${DS_PROMETHEUS}"},
          "fieldConfig": {"defaults": {"decimals": 1, "unit": "bytes"}, "overrides": []},
          "gridPos": {"h": 9, "w": 8, "x": 16, "y": 5}, "id": 9,
          "options": {"legend": {"displayMode": "table", "placement": "bottom", "showLegend": true}},
          "targets": [{"editorMode": "code", "expr": "sum by(job,area) (jvm_memory_used_bytes{job=~\".*backend.*\"})", "legendFormat": "{{job}} {{area}}", "refId": "A"}],
          "title": "Backend JVM 메모리", "type": "timeseries"
        }
      ],
      "refresh": "30s", "schemaVersion": 39,
      "tags": ["InfraReady", "Service", "NeuroPlan", "Backend", "Frontend"],
      "templating": {"list": [{"current": {"text": "Prometheus", "value": "prometheus"}, "name": "DS_PROMETHEUS", "query": "prometheus", "refresh": 1, "type": "datasource"}]},
      "time": {"from": "now-1h", "to": "now"}, "timezone": "browser",
      "title": "06 Service - NeuroPlan", "uid": "infraready-neuroplan-service", "version": 1
    }
