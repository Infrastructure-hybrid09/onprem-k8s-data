apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: neuroplan-backend
  namespace: monitoring
  labels:
    release: monitoring
    app.kubernetes.io/part-of: neuroplan-login-mvp
spec:
  namespaceSelector:
    matchNames:
      - application
  selector:
    matchLabels:
      app.kubernetes.io/name: neuroplan-backend
  endpoints:
    - port: http
      path: /actuator/prometheus
      interval: 30s
      scrapeTimeout: 10s
