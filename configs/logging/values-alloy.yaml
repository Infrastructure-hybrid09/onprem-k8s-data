# ==============================================================================
# InfraReady Grafana Alloy Helm values
# ==============================================================================
# 실행 위치: DevOps VM (/home/devops/monitoring)
# Namespace: logging
# Helm release: alloy
# Helm chart: grafana/alloy 1.12.0 (Alloy 1.19.0)
#
# 역할
# - CP1~3, Worker1~3에 Alloy Pod를 하나씩 배치한다.
# - 각 Alloy는 자신과 같은 노드에 있는 Kubernetes Pod 로그만 수집한다.
# - 수집 로그를 logging/loki-gateway로 전송한다.
# - hostPath를 마운트하지 않고 Kubernetes API를 사용하므로 root 권한이 필요 없다.
# ==============================================================================

global:
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 473
    runAsGroup: 473
    fsGroup: 473
    seccompProfile:
      type: RuntimeDefault

alloy:
  enableReporting: false
  extraEnv:
    - name: NODE_NAME
      valueFrom:
        fieldRef:
          fieldPath: spec.nodeName
  securityContext:
    runAsNonRoot: true
    runAsUser: 473
    runAsGroup: 473
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  configMap:
    create: true
    content: |-
      logging {
        level  = "info"
        format = "logfmt"
      }

      // 이 DaemonSet Pod와 같은 Kubernetes 노드의 Pod만 발견한다.
      discovery.kubernetes "pods" {
        role = "pod"

        selectors {
          role  = "pod"
          field = "spec.nodeName=" + sys.env("NODE_NAME")
        }
      }

      // Grafana Explore에서 검색하기 쉽도록 필수 Kubernetes 라벨만 만든다.
      discovery.relabel "pod_logs" {
        targets = discovery.kubernetes.pods.targets

        rule {
          source_labels = ["__meta_kubernetes_namespace"]
          action        = "replace"
          target_label  = "namespace"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_name"]
          action        = "replace"
          target_label  = "pod"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_container_name"]
          action        = "replace"
          target_label  = "container"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_node_name"]
          action        = "replace"
          target_label  = "node"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name"]
          action        = "replace"
          target_label  = "app"
        }
        rule {
          source_labels = ["__meta_kubernetes_namespace", "__meta_kubernetes_pod_container_name"]
          action        = "replace"
          separator     = "/"
          replacement   = "$1"
          target_label  = "job"
        }
      }

      // Kubernetes API를 통해 컨테이너 stdout/stderr를 tail한다.
      loki.source.kubernetes "pod_logs" {
        targets    = discovery.relabel.pod_logs.output
        forward_to = [loki.process.pod_logs.receiver]
      }

      loki.process "pod_logs" {
        stage.static_labels {
          values = {
            cluster = "neuroplan-onprem",
            source  = "kubernetes-pods",
          }
        }
        forward_to = [loki.write.default.receiver]
      }

      // Loki는 외부에 노출하지 않고 ClusterIP Gateway로만 전송한다.
      loki.write "default" {
        endpoint {
          url = "http://loki-gateway.logging.svc.neuroplan.local/loki/api/v1/push"
        }
      }

controller:
  type: daemonset
  # Control Plane taint가 있어도 CP1~3에 Alloy를 배치한다.
  tolerations:
    - operator: Exists

rbac:
  create: true
serviceAccount:
  create: true

# PC6 외부 Prometheus는 ServiceMonitor CRD를 사용하지 않는다.
serviceMonitor:
  enabled: false
  additionalLabels:
    release: monitoring
  interval: 30s

service:
  enabled: true
  type: ClusterIP

networkPolicy:
  enabled: false
